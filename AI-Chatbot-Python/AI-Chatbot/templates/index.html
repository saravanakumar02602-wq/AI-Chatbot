<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17132b">
<title>AI-Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="glow glow-one"></div>
<div class="glow glow-two"></div>
<main class="app">
  <section class="chat-card" aria-label="AI-Chatbot">
    <header class="topbar">
      <div class="avatar" aria-hidden="true">A</div>
      <div class="brand-copy">
        <h1>AI-Chatbot</h1>
        <p><span class="status-dot"></span>Knowledge assistant · available locally</p>
      </div>
      <button id="clear" class="clear-button" type="button">New chat</button>
    </header>

    <div id="log" aria-live="polite" aria-relevant="additions"></div>

    <form id="f" autocomplete="off">
      <label class="visually-hidden" for="q">Your message</label>
      <input id="q" placeholder="Ask about AI, machine learning, programming..." maxlength="200">
      <button id="send" type="submit" aria-label="Send message">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
